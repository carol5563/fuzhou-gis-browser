<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fuzhou-gis-browser/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ol-week1</title>
    <style>.map-btns,.tool-bar{z-index:1;position:absolute;top:20px;left:60px}.tool-bar{gap:10px;display:flex}.ol-popup{background-color:#fff;border:1px solid #ccc;border-radius:10px;min-width:280px;padding:15px;position:absolute;bottom:12px;left:-50px;box-shadow:0 1px 4px #0003}.ol-popup:after,.ol-popup:before{content:" ";pointer-events:none;border:solid #0000;width:0;height:0;position:absolute;top:100%}.ol-popup:after{border-width:10px;border-top-color:#fff;margin-left:-10px;left:48px}.ol-popup:before{border-width:11px;border-top-color:#ccc;margin-left:-11px;left:48px}.ol-popup-closer{text-decoration:none;position:absolute;top:2px;right:8px}.ol-popup-closer:after{content:"✖"}</style>
    <script type="module" crossorigin src="/fuzhou-gis-browser/assets/index-DnABsaJV.js"></script>
    <link rel="stylesheet" crossorigin href="/fuzhou-gis-browser/assets/index-BKEGTAuU.css">
  </head>
  <body>
    <div id="app" style="height: 100vh">
      <div id="popup" class="ol-popup">
        <a href="#" id="popup-closer" class="ol-popup-closer"></a>
        <div id="popup-content"></div>
      </div>
      <!-- <div class="map-btns">
        <button id="gdSatelliteBtn">高德影像</button>
      <button id="gdRoadBtn">高德道路</button>
      <button id="tiandituBtn">天地图</button>
      </div> -->
      <div class="tool-bar">
        <div>
          <input type="checkbox" id="gdSatellite" name="gdSatellite" checked />
          <label for="gdSatellite">高德影像</label>
        </div>
        <div>
          <input type="checkbox" id="gdRoad" name="gdRoad" />
          <label for="gdRoad">高德道路</label>
        </div>
        <div>
          <input type="checkbox" id="gdAnnotation" name="gdAnnotation" checked />
          <label for="gdAnnotation">高德注记</label>
        </div>

        <div>
          <input type="checkbox" id="tianditu" name="tianditu" />
          <label for="tianditu">天地图</label>
        </div>
        <div>
          <input type="checkbox" id="tiandituAnnotation" name="tiandituAnnotation" />
          <label for="tiandituAnnotation">天地图注记</label>
        </div>

        <div>
          <input type="checkbox" id="geoVector" name="geoVector" checked />
          <label for="geoVector">几何轮廓</label>
        </div>

        <div>
          <input type="checkbox" id="geoMarker" name="geoMarker" checked />
          <label for="geoMarker">标记点</label>
        </div>
        

        <div>
          <input
            type="range"
            id="opacity"
            name="opacity"
            min="0"
            max="1"
            step="0.1"
            value="1"
          />
        </div>
      </div>
    </div>
  </body>
</html>
